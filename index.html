<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Danh bạ Chính quyền Cứu trợ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #1d4ed8;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 8px 10px;
      text-align: left;
    }
    th {
      background-color: #e0e7ff;
    }
    tr:hover {
      background-color: #f3f4f6;
    }
    .filter-box {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      justify-content: center;
    }
    select, input {
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Danh bạ Chính quyền Cứu trợ</h1>

  <div class="filter-box">
    <select id="filter-tinh">
      <option value="">-- Chọn Tỉnh/Thành --</option>
    </select>
    <select id="filter-xa">
      <option value="">-- Chọn Xã/Phường --</option>
    </select>
    <input type="text" id="search" placeholder="Tìm theo tên hoặc chức vụ...">
  </div>

  <table id="data-table">
    <thead>
      <tr>
        <th>Tỉnh/TP</th>
        <th>Xã/Phường</th>
        <th>Thôn/Xóm</th>
        <th>Họ tên</th>
        <th>Chức vụ</th>
        <th>Số điện thoại</th>
        <th>Trước sáp nhập</th>
        <th>Đặc điểm địa hình</th>
      </tr>
    </thead>
    <tbody id="data-body">
      <tr><td colspan="8" align="center">Đang tải dữ liệu...</td></tr>
    </tbody>
  </table>

  <script>
    // 🔗 API lấy dữ liệu từ Google Sheet (bạn đã cung cấp)
    const sheetURL = "https://script.googleusercontent.com/macros/echo?user_content_key=AehSKLgppCAEl0RthK6-BToah4P-HMYJqGV1Bf86IySA7xW02iAIu-aB_e-XD1qQDcR4oeCKGRT1hZlCKRlfcMvi27EeJy0r0F6CwFifjghDd0WrYATzP1S6MxwTeIGcLxVq8v4uVeRsgQQEC0nv67R1jq3U7-SZSEgF6AdVdcLd2UB0-tb_zeIRUasP3ZZ8ifnTsKo1CTegLs4J75PGlprbfoDADSZ-k49z1I5XtbAtZrw049RQRQ8Vj6Dx39XTh4S2Gy1RXy0UoDEDa1vJBymE_83URjxU8w&lib=MNlCDEoLrZA_U2CivsAHrwTJOzZw8k3LO";

    let allData = [];

    // 📦 Hàm tải dữ liệu từ API
    async function loadData() {
      try {
        const res = await fetch(sheetURL);
        const data = await res.json();
        allData = data;
        renderTable(data);
        fillFilters(data);
      } catch (err) {
        document.getElementById("data-body").innerHTML =
          "<tr><td colspan='8' align='center'>Không thể tải dữ liệu!</td></tr>";
        console.error("Lỗi tải dữ liệu:", err);
      }
    }

    // 🧭 Hiển thị dữ liệu vào bảng
    function renderTable(data) {
      const tbody = document.getElementById("data-body");
      tbody.innerHTML = "";
      if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='8' align='center'>Không có dữ liệu</td></tr>";
        return;
      }

      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row["Tỉnh/TP"] || ""}</td>
          <td>${row["Xã/Phường"] || ""}</td>
          <td>${row["Thôn/Xóm"] || ""}</td>
