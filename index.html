<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bảng Cứu Trợ Thông Minh 🌊</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body {
      background-color: #f3f7fb;
      font-family: "Segoe UI", sans-serif;
    }
    header {
      background-color: #0078d4;
      color: #fff;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 20px;
    }
    .search-box {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      gap: 10px;
    }
    .search-box input {
      width: 320px;
      border-radius: 6px;
      border: 1px solid #ccc;
      padding: 8px 10px;
    }
    .btn-search {
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    table {
      width: 95%;
      margin: auto;
    }
    th {
      background-color: #eaf3ff;
      font-weight: 600;
      text-align: center;
    }
    td {
      text-align: center;
      vertical-align: middle;
    }
    .status-safe { color: green; font-weight: bold; }
    .status-warning { color: orange; font-weight: bold; }
    .status-flood { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <header>🌊 BẢNG CỨU TRỢ THÔNG MINH – TỰ CẬP NHẬT MỖI 15 PHÚT</header>
  <div id="update-status" class="text-center mt-2">Đang tải dữ liệu...</div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Nhập tên Tỉnh, Xã hoặc Huyện để tìm..." />
    <button class="btn-search" id="searchBtn">🔍 Tìm nhanh</button>
  </div>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>Tỉnh/TP</th>
        <th>Xã/Phường</th>
        <th>Họ và tên</th>
        <th>Chức vụ</th>
        <th>SĐT</th>
        <th>Trước sáp nhập</th>
        <th>Đặc điểm địa hình</th>
        <th>Trạng thái ngập</th>
      </tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
