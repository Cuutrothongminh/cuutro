<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Lượng Mưa & Bản đồ</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { padding: 20px; }
    #map { height: 400px; margin-bottom: 20px; }
    .row-green { background-color: #d4edda; }
    .row-yellow { background-color: #fff3cd; }
    .row-orange { background-color: #ffe5b4; }
    .row-red { background-color: #f8d7da; }
  </style>
</head>
<body>
  <h2>Bảng Lượng Mưa & Bản đồ</h2>

  <div class="mb-3">
    <input type="text" id="searchInput" placeholder="Tìm kiếm..." class="form-control d-inline-block w-auto">
    <button id="searchBtn" class="btn btn-primary">Tìm</button>
    <select id="sortSelect" class="form-select d-inline-block w-auto">
      <option value="default">Sắp xếp theo Tỉnh/TP</option>
      <option value="rain_desc">Lượng mưa giảm dần</option>
      <option value="rain_asc">Lượng mưa tăng dần</option>
    </select>
    <select id="pageSize" class="form-select d-inline-block w-auto">
      <option value="10">10 dòng</option>
      <option value="25">25 dòng</option>
      <option value="50" selected>50 dòng</option>
    </select>
    <button id="refreshBtn" class="btn btn-success">Cập nhật</button>
  </div>

  <div class="mb-2">
    Trang: <button id="prevPage" class="btn btn-sm btn-secondary">&lt;</button>
    <span id="currentPage">1</span>/<span id="totalPage">1</span>
    <button id="nextPage" class="btn btn-sm btn-secondary">&gt;</button>
    | Tổng kết quả: <span id="resultCount">0</span>
  </div>

  <div id="map"></div>

  <table class="table table-bordered table-sm">
    <thead>
      <tr>
        <th>Tỉnh/TP</th>
        <th>Huyện - Tỉnh cũ</th>
        <th>Xã/Phường</th>
        <th>Chức vụ</th>
        <th>Họ và tên</th>
        <th>Số điện thoại</th>
        <th>Đặc điểm địa hình</th>
        <th>Lượng mưa (mm/1h)</th>
        <th>Trạng thái</th>
        <th>Gọi</th>
      </tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>

  <div id="updateStatus" class="mb-3"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
