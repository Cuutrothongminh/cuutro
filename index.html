<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh bạ chính quyền</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    #searchBox { margin-bottom: 15px; }
    th { text-align: center; }
    .status-flood { background:#ff6b6b;color:#fff;font-weight:bold; }
    .status-warning { background:#f7d774;color:#000;font-weight:bold; }
    .status-safe { background:#d4f7d4;color:#000;font-weight:bold; }
  </style>
</head>
<body>

<h2>📌 DANH BẠ CHÍNH QUYỀN — THEO DÕI THỜI TIẾT & NGẬP LỤT</h2>

<div id="update-status" style="margin-bottom:10px;font-weight:bold;">
  Đang tải dữ liệu...
</div>

<div id="searchBox">
  <input id="searchInput" type="text" placeholder="Nhập tên tỉnh hoặc xã..." style="padding:5px;width:250px;">
  <button id="searchBtn" style="padding:6px 10px;">Tìm kiếm</button>
</div>

<table>
  <thead>
    <tr>
      <th>Tỉnh/TP</th>
      <th>Xã/Phường</th>
      <th>Họ và tên</th>
      <th>Chức vụ</th>
      <th>SĐT</th>
      <th>Trước sáp nhập</th>
      <th>Huyện - Tỉnh cũ</th>
      <th>Đặc điểm địa hình</th>
      <th>Mưa (mm)</th>
      <th>Trạng thái ngập</th>
    </tr>
  </thead>
  <tbody id="dataBody"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
