<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <title>Danh bạ cứu hộ – Cấp Tỉnh/Huyện/Xã/Thôn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f6f8; }
        #container { display: flex; }
        #sidebar {
            width: 280px; background: #fff;
            height: 100vh; overflow-y: auto; border-right: 1px solid #ddd;
            padding: 12px;
        }
        #content { flex: 1; padding: 20px; }

        .group-title { cursor: pointer; background: #e9f1ff; padding: 6px 10px; margin: 4px 0; border-radius: 5px; }
        .group-children { margin-left: 15px; display: none; }

        table {
            width: 100%; border-collapse: collapse; background: #fff; margin-top: 20px;
        }
        th, td { padding: 8px; border: 1px solid #ddd; }
        th { background: #f0f0f0; }

        .rain-low { background: #d7ffd9; }
        .rain-mid { background: #fff5c2; }
        .rain-high { background: #ffe3b8; }
        .rain-extreme { background: #ffd6d6; }

        .call-btn {
            background: #28a745; color: #fff; padding: 5px 10px;
            border-radius: 6px; text-decoration: none;
        }

        #searchInput {
            width: 100%; padding: 10px; margin-top: 10px;
            border: 1px solid #bbb; border-radius: 5px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="container">

    <!-- SIDEBAR -->
    <div id="sidebar">
        <h3>Danh mục địa phương</h3>
        <input type="text" id="searchInput" placeholder="Tìm kiếm..." />

        <div id="locationTree"></div>
    </div>

    <!-- CONTENT -->
    <div id="content">
        <h2>DANH BẠ LIÊN HỆ CỨU HỘ</h2>
        <div id="update-status">Đang tải dữ liệu...</div>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Tỉnh</th>
                    <th>Huyện</th>
                    <th>Xã/Phường</th>
                    <th>Thôn/Xóm</th>
                    <th>Người liên hệ</th>
                    <th>SĐT</th>
                    <th>Địa hình</th>
                    <th>Mưa (mm)</th>
                    <th>Cập nhật</th>
                    <th>Gọi ngay</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
