<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh bạ chính quyền</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table, th, td { border: 1px solid #ccc; }
    th { background: #f2f2f2; padding: 8px; text-align: center; }
    td { padding: 6px; }

    .row-red { background: #ffb3b3; font-weight: bold; }
    .row-yellow { background: #fff4b3; font-weight: bold; }
    .row-green { background: #d9ffd9; }

    #map { height: 380px; margin-top: 20px; }

    #searchBox { margin-bottom: 15px; }
  </style>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<h2>📌 DANH BẠ CHÍNH QUYỀN — THEO DÕI THỜI TIẾT & NGẬP LỤT</h2>

<div id="update-status" style="margin-bottom: 10px; font-weight: bold;">
  Đang tải dữ liệu...
</div>

<div id="searchBox">
  <input id="searchInput" type="text" placeholder="Nhập tên tỉnh hoặc xã..." style="padding:5px;width:250px;">
  <button id="searchBtn" style="padding:6px 10px;">Tìm kiếm</button>
</div>

<div id="map"></div>

<table>
  <thead>
    <tr>
      <th>Tỉnh/TP</th>
      <th>Xã/Phường</th>
      <th>Họ và tên</th>
      <th>Chức vụ</th>
      <th>SĐT</th>
      <th>Trước sáp nhập</th>
      <th>Huyện - Tỉnh cũ</th>
      <th>Địa hình</th>
      <th>Mưa (mm)</th>
      <th>Trạng thái ngập</th>
    </tr>
  </thead>
  <tbody id="dataBody"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
