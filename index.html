<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh bạ Chính quyền các cấp</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f6f7fb; }
    h1 { text-align: center; color: #2c3e50; }
    input, select {
      margin: 8px; padding: 8px; border-radius: 6px;
      border: 1px solid #ccc; font-size: 14px;
    }
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
    th, td {
      padding: 10px; border-bottom: 1px solid #ddd;
      text-align: left; font-size: 14px;
    }
    th { background-color: #2980b9; color: white; }
    tr:hover { background-color: #f1f1f1; }
    .filters { text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>📘 Danh bạ Chính quyền các cấp</h1>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="🔍 Tìm theo tên người, xã, thôn, chức vụ..." onkeyup="filterTable()">
    <select id="provinceSelect" onchange="filterTable()">
      <option value="">-- Chọn Tỉnh/Thành phố --</option>
    </select>
    <select id="districtSelect" onchange="filterTable()">
      <option value="">-- Chọn Huyện/Thị xã/TP --</option>
    </select>
    <select id="communeSelect" onchange="filterTable()">
      <option value="">-- Chọn Xã/Phường --</option>
    </select>
  </div>

  <table id="dataTable">
    <thead>
      <tr>
        <th>Tỉnh/Thành phố</th>
        <th>Huyện/Thị xã/TP</th>
        <th>Xã/Phường</th>
        <th>Thôn/Xóm</th>
        <th>Họ và tên</th>
        <th>Chức vụ</th>
        <th>Số điện thoại</th>
        <th>Trước sáp nhập</th>
        <th>Đặc điểm địa hình</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const sheetID = "12Ne9OjotFAmM9zbG9oOZ5KdERO0Y0nKWWlT_GVHtFdU";
    const sheetName = "Tổng";
    const sheetURL = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

    let allData = [];

    async function loadData() {
      try {
        const res = await fetch(sheetURL);
        const text = await res.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        const rows = json.table.rows.map(r => r.c.map(c => c ? c.v : ""));
        allData = rows.slice(1); // Bỏ hàng tiêu đề
        fillTable(allData);
        fillDropdowns(allData);
      } catch (err) {
        console.error("Lỗi tải dữ liệu:", err);
      }
    }

    function fillDropdowns(data) {
      const provinces = [...new Set(data.map(r => r[0]))];
      const provinceSelect = document.getElementById("provinceSelect");
      provinces.forEach(p => {
        const opt = document.createElement("option");
        opt.value = p; opt.textContent = p;
        provinceSelect.appendChild(opt);
      });
    }

    function fillTable(data) {
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";
      data.forEach(r => {
        const tr = document.createElement("tr");
        r.forEach((cell, i) => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const province = document.getElementById("provinceSelect").value;
      const district = document.getElementById("districtSelect").value;
      const commune = document.getElementById("communeSelect").value;

      let filtered = allData.filter(r =>
        (!province || r[0] === province) &&
        (!district || r[1] === district) &&
        (!commune || r[2] === commune) &&
        r.join(" ").toLowerCase().includes(search)
      );
      fillTable(filtered);
      updateDistrictsAndCommunes(province, filtered);
    }

    function updateDistrictsAndCommunes(province, data) {
      const districtSelect = document.getElementById("districtSelect");
      const communeSelect = document.getElementById("communeSelect");
      districtSelect.innerHTML = '<option value="">-- Chọn Huyện/Thị xã/TP --</option>';
      communeSelect.innerHTML = '<option value="">-- Chọn Xã/Phường --</option>';

      if (province) {
        const districts = [...new Set(data.map(r => r[1]))];
        districts.forEach(d => {
          const opt = document.createElement("option");
          opt.value = d; opt.textContent = d;
          districtSelect.appendChild(opt);
        });
      }
    }

    loadData();
  </script>
</body>
</html>
