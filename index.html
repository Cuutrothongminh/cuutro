<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BẢNG CỨU TRỢ THÔNG MINH – TỰ CẬP NHẬT MỖI 15 PHÚT</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f3f7fb;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background: #0078d7;
      color: #fff;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }
    #update-status {
      margin: 10px 0;
      font-size: 14px;
      color: #333;
    }
    .search-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }
    .search-box input {
      width: 300px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .search-box button {
      background: #0078d7;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .search-box button:hover {
      background: #005fa3;
    }
    table {
      width: 95%;
      margin: 0 auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    th, td {
      border: 1px solid #e2e2e2;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #e9f2ff;
    }
    tr:nth-child(even) {
      background: #f8fbff;
    }
  </style>
</head>

<body>
  <header>🌊 BẢNG CỨU TRỢ THÔNG MINH – TỰ CẬP NHẬT MỖI 15 PHÚT</header>
  <div id="update-status">Đang tải dữ liệu...</div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Nhập tên Tỉnh, Xã hoặc Huyện để tìm..." />
    <button id="searchBtn">🔍 Tìm nhanh</button>
  </div>

  <table id="dataTable">
    <thead>
      <tr>
        <th>Tỉnh/TP</th>
        <th>Xã/Phường</th>
        <th>Họ và tên</th>
        <th>Chức vụ</th>
        <th>Số điện thoại</th>
        <th>Trước sáp nhập</th>
        <th>Đặc điểm địa hình</th>
        <th>Trạng thái ngập</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
