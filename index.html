<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BẢNG CỨU TRỢ THÔNG MINH</title>

    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background-color: #f5f9ff;
        margin: 0;
        padding: 0;
      }

      header {
        background-color: #0078d7;
        color: white;
        padding: 15px 10px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
      }

      #search-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 15px;
        flex-wrap: wrap;
      }

      #searchInput {
        padding: 8px 12px;
        font-size: 16px;
        width: 280px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }

      #searchBtn {
        background-color: #0078d7;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 15px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
      }

      #searchBtn:hover {
        background-color: #005fa3;
      }

      #update-status {
        text-align: center;
        margin-top: 10px;
        font-weight: 500;
      }

      table {
        width: 95%;
        margin: 20px auto;
        border-collapse: collapse;
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }

      th, td {
        border: 1px solid #ddd;
        padding: 10px 12px;
        text-align: left;
        font-size: 15px;
      }

      th {
        background-color: #e8f3ff;
        color: #003366;
        text-align: center;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      tr:hover {
        background-color: #eef5ff;
      }

      .status-flood {
        background-color: #ff4d4d;
        color: white;
        font-weight: bold;
        text-align: center;
      }

      .status-warning {
        background-color: #ffc04d;
        color: #333;
        font-weight: bold;
        text-align: center;
      }

      .status-safe {
        background-color: #a6e3a1;
        color: #003300;
        font-weight: bold;
        text-align: center;
      }

      @media (max-width: 768px) {
        table {
          font-size: 14px;
        }
        #searchInput {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <header>🌊 BẢNG CỨU TRỢ THÔNG MINH – TỰ CẬP NHẬT MỖI 15 PHÚT</header>

    <div id="update-status">Đang tải dữ liệu...</div>

    <div id="search-container">
      <input
        type="text"
        id="searchInput"
        placeholder="Nhập tên Tỉnh, Xã hoặc Huyện để tìm..."
      />
      <button id="searchBtn">🔍 Tìm nhanh</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Tỉnh/TP</th>
          <th>Xã/Phường</th>
          <th>Họ và tên</th>
          <th>Chức vụ</th>
          <th>SĐT</th>
          <th>Trước sáp nhập</th>
          <th>Đặc điểm địa hình</th>
          <th>Trạng thái ngập</th>
        </tr>
      </thead>
      <tbody id="dataBody">
        <tr>
          <td colspan="8" style="text-align: center">Đang tải dữ liệu...</td>
        </tr>
      </tbody>
    </table>

    <script src="script.js"></script>
  </body>
</html>
